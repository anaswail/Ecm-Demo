<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" fill="none">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#111827" flood-opacity=".12"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B89B5E"/>
      <stop offset="1" stop-color="#D2B778"/>
    </linearGradient>
  </defs>

  <!-- subtle central glow -->
  <circle cx="450" cy="300" r="125" fill="#B89B5E" opacity=".10" filter="url(#soft)"/>

  <!-- top source cards -->
  <g filter="url(#shadow)">
    <rect x="42" y="38" width="225" height="82" rx="18" fill="#fff"/>
    <rect x="337" y="38" width="225" height="82" rx="18" fill="#fff"/>
    <rect x="632" y="38" width="225" height="82" rx="18" fill="#fff"/>
  </g>

  <!-- document icon -->
  <circle cx="76" cy="79" r="23" fill="#F5F0E6"/>
  <rect x="67" y="64" width="18" height="25" rx="2" stroke="#8C6D35" stroke-width="2"/>
  <path d="M79 64v7h6" stroke="#8C6D35" stroke-width="2"/>
  <path d="M71 76h10M71 81h8" stroke="#8C6D35" stroke-width="1.7"/>
  <text x="112" y="73" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650" fill="#172033">Documents</text>
  <text x="112" y="96" font-family="Inter, Arial, sans-serif" font-size="13" fill="#697386">Different systems</text>

  <!-- email icon -->
  <circle cx="371" cy="79" r="23" fill="#F5F0E6"/>
  <rect x="359" y="68" width="24" height="19" rx="3" stroke="#8C6D35" stroke-width="2"/>
  <path d="M360 70l11 9 11-9" stroke="#8C6D35" stroke-width="2"/>
  <text x="407" y="73" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650" fill="#172033">Emails</text>
  <text x="407" y="96" font-family="Inter, Arial, sans-serif" font-size="13" fill="#697386">Multiple inboxes</text>

  <!-- meetings icon -->
  <circle cx="666" cy="79" r="23" fill="#F5F0E6"/>
  <circle cx="658" cy="73" r="6" stroke="#8C6D35" stroke-width="2"/>
  <circle cx="675" cy="73" r="6" stroke="#8C6D35" stroke-width="2"/>
  <path d="M649 88c1-7 16-7 18 0M666 88c1-7 16-7 18 0" stroke="#8C6D35" stroke-width="2"/>
  <text x="702" y="73" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650" fill="#172033">Meetings</text>
  <text x="702" y="96" font-family="Inter, Arial, sans-serif" font-size="13" fill="#697386">Disconnected tools</text>

  <!-- connector lines -->
  <path d="M154 120 C170 175 260 165 330 225" stroke="#9AA1AC" stroke-width="2" fill="none"/>
  <path d="M449 120 C449 160 449 180 449 210" stroke="#9AA1AC" stroke-width="2" fill="none"/>
  <path d="M745 120 C728 175 638 165 568 225" stroke="#9AA1AC" stroke-width="2" fill="none"/>

  <!-- fragmented information cluster -->
  <g filter="url(#shadow)">
    <rect x="300" y="205" width="72" height="72" rx="13" fill="#3D434B" opacity=".78" transform="rotate(-10 336 241)"/>
    <rect x="385" y="182" width="72" height="72" rx="13" fill="#2B3037" opacity=".90" transform="rotate(7 421 218)"/>
    <rect x="470" y="205" width="72" height="72" rx="13" fill="#3A4048" opacity=".82" transform="rotate(-8 506 241)"/>
    <rect x="345" y="275" width="72" height="72" rx="13" fill="#343A42" opacity=".84" transform="rotate(8 381 311)"/>
    <rect x="426" y="260" width="86" height="86" rx="15" fill="#252B32"/>
    <rect x="505" y="275" width="72" height="72" rx="13" fill="#3A4048" opacity=".82" transform="rotate(-7 541 311)"/>
    <rect x="385" y="350" width="72" height="72" rx="13" fill="#3B4149" opacity=".78" transform="rotate(-8 421 386)"/>
    <rect x="470" y="350" width="72" height="72" rx="13" fill="#30363D" opacity=".84" transform="rotate(8 506 386)"/>
  </g>

  <!-- central document icon -->
  <rect x="452" y="280" width="34" height="44" rx="4" fill="none" stroke="#fff" stroke-width="3"/>
  <path d="M475 280v12h11M459 303h20M459 312h15" stroke="#fff" stroke-width="2.4"/>

  <!-- side label -->
  <path d="M585 300h72" stroke="#697386" stroke-width="2"/>
  <path d="M651 294l8 6-8 6" stroke="#697386" stroke-width="2" fill="none"/>
  <text x="682" y="295" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="650" fill="#172033">Fragmented</text>
  <text x="682" y="318" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="650" fill="#172033">information</text>

  <!-- bottom problem pills -->
  <g filter="url(#shadow)">
    <rect x="105" y="495" width="190" height="58" rx="29" fill="#F7F2E9"/>
    <rect x="355" y="495" width="190" height="58" rx="29" fill="#F7F2E9"/>
    <rect x="605" y="495" width="190" height="58" rx="29" fill="#F7F2E9"/>
  </g>

  <!-- clock -->
  <circle cx="137" cy="524" r="10" stroke="#8C6D35" stroke-width="2"/>
  <path d="M137 518v7l5 3" stroke="#8C6D35" stroke-width="2"/>
  <text x="158" y="530" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#8C6D35">Delays</text>

  <!-- duplication -->
  <path d="M389 516h16v16h-16zM395 510h16v16" stroke="#8C6D35" stroke-width="2" fill="none"/>
  <text x="430" y="530" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#8C6D35">Duplication</text>

  <!-- limited visibility -->
  <circle cx="639" cy="524" r="10" stroke="#8C6D35" stroke-width="2"/>
  <path d="M632 531l14-14" stroke="#8C6D35" stroke-width="2"/>
  <text x="659" y="530" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#8C6D35">Limited visibility</text>
</svg>